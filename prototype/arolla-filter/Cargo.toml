[package]
name = "arolla-filter"
version = "0.1.0"
edition = "2021"
publish = false
description = "Envoy HTTP filter implementing Arolla server-side retry admission (paper Alg. 1, aggregate-only)"

[lib]
name = "arolla_filter"
crate-type = ["cdylib"]

[dependencies]
proxy-wasm = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
# Smaller wasm binaries and lower proxy overhead.
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true
