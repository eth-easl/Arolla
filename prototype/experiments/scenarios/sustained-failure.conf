# Scenario: Sustained partial failure on cart → Redis (paper §6.2.1).
#
# Reference:
#   "We exercise this scenario by injecting 50% failure on the cart → Redis
#    path for 60s (t=30–90s). Half of all cart requests return HTTP 503;
#    checkout, which depends on cart, begins failing and retrying along the
#    four-hop chain (frontend → checkout → cart → Redis)."
#
# Sourced by run-experiment.sh. May set any of:
#   SCENARIO_TITLE
#   SCENARIO_FAULT_MANIFEST    (relative to prototype/manifests/online-boutique/)
#   WARMUP_SEC, PREFAULT_SEC, FAULT_SEC, RECOVERY_SEC, COOLDOWN_SEC

SCENARIO_TITLE="Sustained partial failure (paper §6.2.1)"
SCENARIO_FAULT_MANIFEST="faults/cartservice-50pct.yaml"

WARMUP_SEC=60      # let the cluster stabilize after load starts
PREFAULT_SEC=30    # steady-state baseline before fault
FAULT_SEC=60       # paper: 60s of 50% abort on cartservice
RECOVERY_SEC=60    # watch the system recover once fault is removed
COOLDOWN_SEC=30    # drain pending requests / metrics before stopping load
