# Scenario: Transient failure burst (paper §6.3 — "does control hurt?").
#
# Reference:
#   "We inject brief fault bursts: 50% abort on cart → Redis for
#    d ∈ {1, 2, 5}s, repeated every 30s over a 5-minute run. These bursts
#    are short enough that retries should succeed (the fault clears within
#    the retry window)."
#
# Our current runner supports a single-burst timeline; to reproduce the
# multi-burst pattern, either:
#   (a) extend run-experiment.sh with a burst-loop mode, or
#   (b) run this scenario multiple times and concatenate the CSVs.
# For now this config models a single short burst as a smoke check.

SCENARIO_TITLE="Transient burst (paper §6.3, single-burst approximation)"
SCENARIO_FAULT_MANIFEST="faults/cartservice-50pct.yaml"

WARMUP_SEC=60
PREFAULT_SEC=30
FAULT_SEC=5        # single short burst
RECOVERY_SEC=30
COOLDOWN_SEC=15
