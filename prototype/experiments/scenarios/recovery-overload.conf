# Scenario: Recovery-phase overload (paper §6.2.2).
#
# Reference:
#   "We exercise this scenario by taking productcatalog fully offline for
#    20s (t=30–50s), then restoring it. During the outage, browse and
#    recommendation fail completely; the load generator continues sending
#    requests at the steady-state rate. At t=50s productcatalog becomes
#    healthy, and the accumulated retry demand surges simultaneously."
#
# NOTE: this reuses faults/productcatalog-fault.yaml, which hits
# productcatalogservice with 50% abort + 30% delay. For the paper's "fully
# offline" scenario you may want a new 100% abort manifest — add one under
# manifests/online-boutique/faults/ and point this config at it.

SCENARIO_TITLE="Recovery-phase overload (paper §6.2.2)"
SCENARIO_FAULT_MANIFEST="faults/productcatalog-fault.yaml"

WARMUP_SEC=60
PREFAULT_SEC=30
FAULT_SEC=20       # paper: 20s outage
RECOVERY_SEC=90    # longer recovery window to observe re-collapse / stabilization
COOLDOWN_SEC=30
