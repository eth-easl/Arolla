# Failure characteristic sweep: vary fault severity and fault duration.
#
# All policies at default parameters. Shows that arolla recovers across
# a wide range of failure scenarios without retuning, while baselines
# have narrow operating regimes.

defaults: &defaults
  client_profile: post-cart-stress-open
  fault_manifest: cartservice-100pct
  warmup: 30
  prefault: 60
  recovery: 60
  cooldown: 10

sweeps:

  # Panel (a): Vary failure rate (abort percentage on cart)
  # Higher abort % = more requests fail during the fault window = bigger
  # retry storm. Tests each policy's ability to handle partial vs total
  # failure. Edits cartservice-100pct.yaml's abort percentage in place.
  - name: failure-rate
    description: "All policies at defaults, vary cart abort percentage"
    policies: [no-control, circuit-breaker, envoy-retry-budget, arolla]
    parameter:
      name: abort_pct
      location: fault_yaml
      field: fault.abort.percentage.value
      values: [10, 30, 50, 70, 100]
    base:
      <<: *defaults
      fault: 10

  # Panel (b): Vary fault duration (100% abort, fixed 1500 rps)
  # Longer faults build larger retry backlogs. Tests whether each policy
  # can drain the backlog and recover after increasingly severe events.
  - name: fault-duration
    description: "All policies at defaults, vary fault duration"
    policies: [no-control, circuit-breaker, envoy-retry-budget, arolla]
    parameter:
      name: fault_duration
      location: cli
      field: fault
      values: [5, 10, 20, 30, 60]
    base:
      <<: *defaults
