# ==========================================================================
# Circuit-breaker parameter sensitivity analysis (4-panel figure)
# ==========================================================================

defaults: &defaults
  client_profile: post-cart-stress-open
  fault_manifest: cartservice-100pct
  warmup: 30
  prefault: 60
  fault: 10
  recovery: 300
  cooldown: 10

sweeps:
  - name: cb-threshold
    description: "Recovery time vs. CB ejection threshold theta"
    policies: [circuit-breaker]
    parameter:
      name: failure_percentage_threshold
      location: policy_yaml
      field: outlier_detection.failure_percentage_threshold
      default: 80
      values: [10, 20, 40, 60, 80, 90, 95]
    base:
      <<: *defaults

  - name: cb-ejection-time
    description: "Recovery time vs. CB base ejection duration"
    policies: [circuit-breaker]
    parameter:
      name: base_ejection_time
      location: policy_yaml
      field: outlier_detection.base_ejection_time
      default: "5s"
      values: ["1s", "2s", "5s", "10s", "20s", "30s", "60s"]
    base:
      <<: *defaults


  - name: cb-interval
    description: "Recovery time vs. CB evaluation interval"
    policies: [circuit-breaker]
    parameter:
      name: interval
      location: policy_yaml
      field: outlier_detection.interval
      default: "1s"
      values: ["1s", "2s", "5s", "10s", "15s", "30s"]
    base:
      <<: *defaults


  - name: cb-request-volume
    description: "Recovery time vs. CB minimum request volume"
    policies: [circuit-breaker]
    parameter:
      name: failure_percentage_request_volume
      location: policy_yaml
      field: outlier_detection.failure_percentage_request_volume
      default: 10
      values: [1, 3, 5, 10, 20, 50, 100]
    base:
      <<: *defaults


  - name: cb-max-ejection-time
    description: "Recovery time vs. CB max ejection time (exponential backoff cap)"
    policies: [circuit-breaker]
    parameter:
      name: max_ejection_time
      location: policy_yaml
      field: outlier_detection.max_ejection_time
      default: "30s"
      values: ["1s", "5s", "10s"]
    base:
      <<: *defaults

  - name: cb-consecutive
    description: "Recovery time vs. CB consecutive-5xx count (count-based mode)"
    policies: [circuit-breaker-consecutive]
    parameter:
      name: consecutive_5xx
      location: policy_yaml
      field: outlier_detection.consecutive_5xx
      default: 5
      values: [1, 3, 5, 10, 20, 50]
    base:
      <<: *defaults
