# ==========================================================================
# Circuit-breaker parameter sensitivity analysis (4-panel figure)
# ==========================================================================
#
# Envoy outlier detection (failure-rate mode). Four OPAT sweeps:
#
#   Panel (a): failure_percentage_threshold (theta)
#              The ejection threshold. Too low → trips on normal variance,
#              blocks healthy traffic. Too high → never trips → no protection.
#              Expected: narrow working range near the actual failure rate;
#              sharp cliffs on both sides.
#
#   Panel (b): base_ejection_time
#              How long a host stays ejected. Too short → oscillation
#              (eject → re-admit → fail → eject). Too long → blocks traffic
#              into recovery well past fault end.
#              Expected: sweet spot near fault duration; degrades on both sides.
#
#   Panel (c): interval
#              Re-evaluation frequency. Short → responsive to state changes.
#              Long → slow to detect faults → amplification before CB engages.
#              Expected: monotonic — shorter is better, diminishing returns.
#
#   Panel (d): failure_percentage_request_volume
#              Minimum sample size before ejection is considered. Too low →
#              noisy (trips on 1 error). Too high → slow to detect real faults.
#              Expected: trade-off between responsiveness and stability.
#
# Fixed failure scenario: 100% abort on cartservice for 10s.
# Defaults held constant: theta=80, base_ejection_time=5s, interval=1s,
# failure_percentage_request_volume=10.
#
# Running:
#   cd prototype/experiments
#   ./run_sweep.sh sweeps/cb-sensitivity.yaml                  # all 4 sweeps
#   ./run_sweep.sh sweeps/cb-sensitivity.yaml cb-threshold     # just panel (a)
#
# ==========================================================================

defaults: &defaults
  client_profile: post-cart-stress-open
  fault_manifest: cartservice-100pct
  warmup: 30
  prefault: 60
  fault: 10
  recovery: 60
  cooldown: 10

sweeps:

  # Panel (a): Ejection threshold theta
  #   Low  theta → trips during normal variance → blocks healthy traffic
  #   High theta → doesn't trip until near-total failure → no protection
  #   Default: 80
  - name: cb-threshold
    description: "Recovery time vs. CB ejection threshold theta"
    policies: [circuit-breaker]
    parameter:
      name: failure_percentage_threshold
      location: policy_yaml
      field: outlier_detection.failure_percentage_threshold
      default: 80
      values: [10, 20, 40, 60, 80, 90, 95]
    base:
      <<: *defaults

  # Panel (b): Ejection duration
  #   Short → oscillation: host keeps bouncing in and out of ejection
  #   Long  → blocks traffic into recovery phase, well past fault end
  #   Default: 5s
  #
  #   Note: with fault=10s, ejection times near 10s align with the fault
  #   window. Times >> 10s extend the outage into the recovery phase.
  - name: cb-ejection-time
    description: "Recovery time vs. CB base ejection duration"
    policies: [circuit-breaker]
    parameter:
      name: base_ejection_time
      location: policy_yaml
      field: outlier_detection.base_ejection_time
      default: "5s"
      values: ["1s", "2s", "5s", "10s", "20s", "30s", "60s"]
    base:
      <<: *defaults

  # Panel (c): Evaluation interval
  #   Short → detects fault quickly, responsive to recovery
  #   Long  → slow to detect → more amplification before CB engages,
  #           slow to un-eject → delays recovery
  #   Default: 1s
  - name: cb-interval
    description: "Recovery time vs. CB evaluation interval"
    policies: [circuit-breaker]
    parameter:
      name: interval
      location: policy_yaml
      field: outlier_detection.interval
      default: "1s"
      values: ["1s", "2s", "5s", "10s", "15s", "30s"]
    base:
      <<: *defaults

  # Panel (d): Minimum request volume
  #   Low  → trips on small sample → noisy, false positives
  #   High → needs many requests before considering ejection → slow to trip
  #   Default: 10
  - name: cb-request-volume
    description: "Recovery time vs. CB minimum request volume"
    policies: [circuit-breaker]
    parameter:
      name: failure_percentage_request_volume
      location: policy_yaml
      field: outlier_detection.failure_percentage_request_volume
      default: 10
      values: [1, 3, 5, 10, 20, 50, 100]
    base:
      <<: *defaults
