defaults: &defaults
  client_profile: post-cart-stress-open
  # cpu_stress_target: cartservice
  # cpu_stress_workers: 4
  warmup: 30
  prefault: 30
  recovery: 30
  cooldown: 10

sweeps:

  - name: rps-sweep
    description: "load sweep"
    policies: [no-control]
    # policies: [no-control, circuit-breaker, envoy-retry-budget, arolla]
    parameter:
      name: rate_rps
      location: client_profile
      field: rate_rps
      values: [1000, 1100, 1200, 1300, 1400]
    base:
      <<: *defaults
      # cpu_stress_load: 95
      fault: 0
