# ==========================================================================
# Sensitivity analysis for NSDI submission
# ==========================================================================
#
# Two figures:
#
#   Figure A: "Recovery time vs. parameter value"
#     OPAT sweep — one parameter at a time, fixed failure scenario.
#     Shows that Arolla has a broad "safe region" of parameter values
#     that all achieve fast recovery, while baselines have narrow
#     working ranges with sharp cliffs on both sides.
#     Panels: (a) CB threshold θ, (b) Envoy budget b%, (c) Arolla r,
#             (d) Arolla C.
#
#   Figure B: "Recovery time vs. failure characteristics"
#     All mechanisms at their default parameters. Vary the failure
#     scenario (rate or duration). Shows that Arolla doesn't need
#     retuning when the failure changes — its event-refill tracks
#     actual health — while baselines have narrow operating regimes.
#     Panels: (a) Vary failure rate, (b) Vary failure duration.
#
#   Ablation: "Mixed refill vs. single refill source"
#     Arolla-only. Tests the contribution of each refill mechanism
#     (event vs time) by disabling one at a time.
#
# ==========================================================================

defaults: &defaults
  client_profile: post-cart-stress-open
  cpu_stress_target: cartservice
  cpu_stress_workers: 4
  warmup: 30
  prefault: 50
  recovery: 60
  cooldown: 10

sweeps:

  # ========================================================================
  # FIGURE A — Recovery time vs. parameter value (OPAT)
  #
  # Fixed failure scenario: 50% failure rate, 60s duration.
  # One panel per policy, sweep the policy's key parameter.
  # ========================================================================

  # Panel (a): Circuit breaker — sweep ejection threshold θ
  - name: cb-threshold
    description: "CB threshold θ: narrow safe region, cliffs on both sides"
    policies: [circuit-breaker]
    parameter:
      name: failure_percentage_threshold
      location: policy_yaml
      field: outlier_detection.failure_percentage_threshold
      values: [10, 20, 30, 50, 70, 90]
    base:
      <<: *defaults
      cpu_stress_load: 95
      fault: 30

  # Panel (b): Envoy retry budget — sweep budget_percent
  - name: rb-budget
    description: "Envoy budget b%: monotonic, no feedback, cliff at high values"
    policies: [envoy-retry-budget]
    parameter:
      name: budget_percent
      location: policy_yaml
      field: retry_budget.budget_percent.value
      values: [5, 10, 20, 40, 60, 80]
    base:
      <<: *defaults
      cpu_stress_load: 95
      fault: 30

  # Panel (c): Arolla — sweep event-refill rate r (deposit ratio)
  - name: arolla-r
    description: "Arolla r: broad plateau — robust to tuning"
    policies: [arolla]
    parameter:
      name: r
      location: policy_yaml
      field: pluginConfig.r
      values: [0.01, 0.05, 0.1, 0.2, 0.5, 1.0]
    base:
      <<: *defaults
      cpu_stress_load: 95
      fault: 30

  # Panel (d): Arolla — sweep bucket capacity C
  - name: arolla-c
    description: "Arolla C: broad plateau — robust to tuning"
    policies: [arolla]
    parameter:
      name: capacity
      location: policy_yaml
      field: pluginConfig.capacity
      values: [1, 5, 10, 20, 50, 100]
    base:
      <<: *defaults
      cpu_stress_load: 95
      fault: 30

  # ========================================================================
  # FIGURE B — Recovery time vs. failure characteristics
  #
  # All mechanisms at their default/recommended parameters.
  # Vary the failure scenario to show that Arolla doesn't need retuning.
  # ========================================================================

  # Panel (a): Vary failure rate (fixed 60s duration)
  - name: failure-rate
    description: "All policies at defaults, vary failure rate"
    policies: [no-control, circuit-breaker, envoy-retry-budget, arolla]
    parameter:
      name: cpu_stress_load
      location: cli
      field: cpu_stress_load
      values: [10, 30, 50, 70, 90]
    base:
      <<: *defaults
      cpu_stress_load: 50           # overridden by sweep
      fault: 60

  # Panel (b): Vary failure duration (fixed 50% rate)
  - name: failure-duration
    description: "All policies at defaults, vary fault duration"
    policies: [no-control, circuit-breaker, envoy-retry-budget, arolla]
    parameter:
      name: fault_duration
      location: cli
      field: fault
      values: [5, 15, 30, 60, 120]
    base:
      <<: *defaults
      cpu_stress_load: 50
      fault: 60                     # overridden by sweep

  # ========================================================================
  # ABLATION — Mixed refill vs. single refill source
  #
  # Arolla-only. Tests the contribution of each refill mechanism by
  # disabling one at a time. Three configurations:
  #   - Mixed refill (default): r=0.1, t=1.0
  #   - Event refill only:      r=0.1, t=0.0
  #   - Time refill only:       r=0.0, t=1.0
  #
  # Swept across failure rates to show how each refill source
  # contributes differently as the failure gets more severe.
  # ========================================================================

  - name: ablation-event-only
    description: "Arolla with event refill only (t=0) — how does it degrade?"
    policies: [arolla]
    parameter:
      name: cpu_stress_load
      location: cli
      field: cpu_stress_load
      values: [10, 30, 50, 70, 90]
    # Override arolla.yaml: set t=0 (disable time refill)
    overrides:
      policy_yaml:
        pluginConfig.t: 0.0
        pluginConfig.r: 0.1
    base:
      <<: *defaults
      fault: 60

  - name: ablation-time-only
    description: "Arolla with time refill only (r=0) — how does it degrade?"
    policies: [arolla]
    parameter:
      name: cpu_stress_load
      location: cli
      field: cpu_stress_load
      values: [10, 30, 50, 70, 90]
    # Override arolla.yaml: set r=0 (disable event refill)
    overrides:
      policy_yaml:
        pluginConfig.t: 1.0
        pluginConfig.r: 0.0
    base:
      <<: *defaults
      fault: 60

  - name: ablation-mixed-default
    description: "Arolla with default mixed refill (r=0.1, t=1.0) — baseline for ablation"
    policies: [arolla]
    parameter:
      name: cpu_stress_load
      location: cli
      field: cpu_stress_load
      values: [10, 30, 50, 70, 90]
    base:
      <<: *defaults
      fault: 60
