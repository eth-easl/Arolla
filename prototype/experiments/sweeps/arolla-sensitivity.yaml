# ==========================================================================
# Arolla parameter sensitivity analysis (3-panel figure)
# ==========================================================================
#
# Figure: "Recovery time vs. Arolla parameter" (OPAT)
#
#   Panel (a): Recovery time vs. r   (event-refill rate, tokens per success)
#   Panel (b): Recovery time vs. t   (time-refill rate, tokens per second)
#   Panel (c): Recovery time vs. C   (bucket capacity)
#
# Fixed failure scenario: 100% abort on cartservice for 10s
# (Istio fault manifest cartservice-100pct.yaml).
# One parameter swept at a time; the other two held at defaults
# (r=0.1, t=1.0, C=20).
#
# Expected result: broad plateau of fast recovery across the middle of
# each parameter range, with degradation only at extreme values:
#   - Too restrictive (low r/t/C) → retries starved, goodput suffers
#     but recovery stays fast because the server is not overloaded.
#   - Too permissive (high r/t/C) → retries amplify, server overloaded
#     during fault → recovery slows due to backlog drain.
#
# Running:
#   cd prototype/experiments
#   ./run_sweep.sh sweeps/arolla-sensitivity.yaml              # all 3 sweeps
#   ./run_sweep.sh sweeps/arolla-sensitivity.yaml arolla-r     # just panel (a)
#
# Plotting:
#   python3 plot_arolla_sensitivity.py \
#       outputs/prototype/arolla-sensitivity/<timestamp>/post-cart-stress-open
#
# ==========================================================================

defaults: &defaults
  client_profile: post-cart-stress-open
  fault_manifest: cartservice-100pct
  warmup: 30
  prefault: 60
  fault: 25
  recovery: 100
  cooldown: 10

sweeps:

  # Panel (a): Sweep event-refill rate r
  #   Low  r → bucket barely refills on success → retries throttled aggressively
  #   High r → each success donates many tokens → retries flow freely → amplification
  #   Default: r=0.1 (fixed: t=1.0, C=20)
  - name: arolla-r
    description: "Recovery time vs. event-refill rate r (t=1.0, C=20 fixed)"
    policies: [arolla]
    parameter:
      name: r
      location: policy_yaml
      field: pluginConfig.r
      values: [0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1.0]
    base:
      <<: *defaults

  # Panel (b): Sweep time-refill rate t
  #   t=0   → purely event-driven; may starve during severe failures
  #   High t → time refill dominates → retries always admitted → amplification
  #   Default: t=1.0 (fixed: r=0.1, C=20)
  - name: arolla-t
    description: "Recovery time vs. time-refill rate t (r=0.1, C=20 fixed)"
    policies: [arolla]
    parameter:
      name: t
      location: policy_yaml
      field: pluginConfig.t
      values: [0.0, 0.1, 0.5, 1.0, 2.0, 5.0, 10.0]
    base:
      <<: *defaults

  # Panel (c): Sweep bucket capacity C
  #   Low  C → minimal burst budget → retries throttled immediately
  #   High C → large burst absorber → initial retry wave uncontrolled
  #   Default: C=20 (fixed: r=0.1, t=1.0)
  - name: arolla-c
    description: "Recovery time vs. bucket capacity C (r=0.1, t=1.0 fixed)"
    policies: [arolla]
    parameter:
      name: capacity
      location: policy_yaml
      field: pluginConfig.capacity
      values: [1, 2, 5, 10, 20, 50, 100]
    base:
      <<: *defaults
