# Baseline 3: Envoy retry budget (via Istio 1.27+ native API).

---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: arolla-baseline-retry-budget
  namespace: online-boutique
spec:
  host: "*.online-boutique.svc.cluster.local"
  trafficPolicy:
    retryBudget:
      percent: 1.0          # cap retries at 10% of active requests
      minRetryConcurrency: 1 # always allow at least 1 concurrent retry
