apiVersion: extensions.istio.io/v1alpha1
kind: WasmPlugin
metadata:
  name: arolla-fairness
  namespace: online-boutique
spec:
  phase: AUTHN
  # __MASTER_IP__ is substituted by deploy-policy.sh at apply time.
  url: http://__MASTER_IP__:8000/arolla_filter_fairness.wasm
  failStrategy: FAIL_CLOSE
  pluginConfig:
    r: 0.1
    capacity: 20.0
    t: 1.0
    attempt_header: "x-envoy-attempt-count"
    attempt_header_secondary: "X-Attempt-Number"
    reject_status: 429
    # Per-tenant fairness: use the client profile name as tenant key.
    # traffic_gen.py sets this header on every request.
    tenant_header: "X-Retry-Client-Type"
    window_s: 10.0
