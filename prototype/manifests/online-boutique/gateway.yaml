# Gateway: Entry point for external (north-south) traffic.
#
# Uses NodePort for bare-metal (Emulab). On cloud, remove the annotation
# to get a LoadBalancer instead.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: boutique-gateway
  namespace: online-boutique
  annotations:
    networking.istio.io/service-type: NodePort
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
