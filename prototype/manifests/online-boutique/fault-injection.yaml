# Istio VirtualService — Fault Injection for productcatalogservice
#
# productcatalogservice has high fan-in (frontend, checkoutservice,
# recommendationservice all call it), making it ideal for demonstrating
# cascading failures and retry amplification.
#
# Usage:
#   Apply:  kubectl apply -f fault-injection.yaml
#   Remove: kubectl delete -f fault-injection.yaml
#
# Tuning:
#   - abort.percentage.value: % of requests that return HTTP 503
#   - delay.percentage.value: % of requests with artificial latency
#   - delay.fixedDelay: how much latency to inject
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: productcatalog-fault
  namespace: online-boutique
spec:
  hosts:
  - productcatalogservice
  http:
  - fault:
      abort:
        percentage:
          value: 50.0
        httpStatus: 503
      delay:
        percentage:
          value: 30.0
        fixedDelay: 3s
    route:
    - destination:
        host: productcatalogservice
