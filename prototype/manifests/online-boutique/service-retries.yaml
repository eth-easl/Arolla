# ----- shippingservice -------------------------------------------------------
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: shippingservice-routing
  namespace: online-boutique
spec:
  hosts:
  - shippingservice
  http:
  - retries:
      attempts: 3
      # Old value 5ms was inherited from a near-idle calibration. Under
      # checkout-fan-out load, shipping's GetQuote and ShipOrder both
      # routinely take >5ms each, so 5ms caused spurious cancellations.
      # Bumped to 100ms for headroom under load.
      perTryTimeout: 100ms
      retryOn: 5xx,gateway-error,connect-failure,refused-stream,reset
    route:
    - destination:
        host: shippingservice
