# Client configuration for the retry budget demo.
#
# The client runs from CLIENT_HOST (defined in k8s-config.sh), not the local
# machine. Traffic flows:
#   CLIENT_HOST (curl) → Gateway NodePort → HTTPRoute (with retries) → backend
#
# The backend has a tunable failure rate (default 50%).
# Failed requests trigger per-request retries (HTTPRoute).
# The BackendTrafficPolicy caps retries at 20% of total traffic.
#
# ── Get the Gateway endpoint ─────────────────────────────────────────────────
#
#   NODE_PORT=$(kubectl -n retry-budget-test get svc \
#       -l gateway.networking.k8s.io/gateway-name=retry-gateway \
#       -o jsonpath='{.spec.ports[?(@.name=="http")].nodePort}')
#
#   Or just run:  ./deploy-app.sh retry-budget --status
#
# ── Test commands (run on CLIENT_HOST via SSH) ───────────────────────────────
#
#   # Single request (may succeed or get 503 after retries exhausted)
#   ssh $CLIENT_HOST "curl -s -H 'Host: retry.example.com' http://<MASTER_HOST>:\$NODE_PORT/"
#
#   # Blast traffic to observe retry budget in action
#   ssh $CLIENT_HOST "for i in \$(seq 1 100); do
#     curl -s -o /dev/null -w '%{http_code}\n' \
#       -H 'Host: retry.example.com' http://<MASTER_HOST>:\$NODE_PORT/
#   done | sort | uniq -c"
#
#   Or just run:  ./deploy-app.sh retry-budget --test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: client-config
  namespace: retry-budget-test
data:
  gateway-host: "retry.example.com"
