# BackendTrafficPolicy with Retry Budget (GEP-3388)
#
# This is the core of the retry budget feature. It attaches to the backend
# Service and dynamically limits what fraction of traffic can be retries.
#
# How it works:
#   - Over each 10-second window, track all requests to this service
#   - If retries exceed 20% of total requests, reject additional retries (503)
#   - Always allow at least 10 retries/sec (so low-traffic services can retry)
#
# Example:
#   1000 requests in the last 10s → budget allows 200 retries
#   Once 200 retries are used → additional retries get 503 immediately
#   This prevents retry storms during cascading failures.
#
# Ref: https://gateway-api.sigs.k8s.io/geps/gep-3388/
---
apiVersion: gateway.networking.x-k8s.io/v1alpha1
kind: XBackendTrafficPolicy
metadata:
  name: backend-retry-budget
  namespace: retry-budget-test
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: backend
  retryConstraint:
    budget:
      percent: 20
      interval: "10s"
    minRetryRate:
      count: 10
      interval: "1s"
