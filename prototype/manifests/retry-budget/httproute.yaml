# HTTPRoute with retry configuration.
#
# When the backend returns 503, the Gateway retries up to 3 times.
# This is the per-request, per-route retry config.
#
# The BackendTrafficPolicy (retry budget) adds a GLOBAL cap on top:
# even if the route says "retry 3 times", the budget can reject the
# retry if total retries exceed 20% of traffic.
#
# Together:
#   HTTPRoute retry  → "should this request be retried?" (per-request)
#   RetryConstraint  → "can the system afford this retry?" (global budget)

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-route
  namespace: retry-budget-test
spec:
  parentRefs:
    - name: retry-gateway
      namespace: retry-budget-test
  hostnames:
    - "retry.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: backend
          port: 80
      retry:
        codes:
          - 503
        attempts: 3
        backoff: "100ms"
