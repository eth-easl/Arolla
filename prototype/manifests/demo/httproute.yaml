# HTTPRoute: Defines how the Gateway routes incoming requests to backend Services.
#
# This route implements a 50/50 canary traffic split:
#   - 50% of requests → backend-v1
#   - 50% of requests → backend-v2
#
# Traffic matching:
#   - Host: test.example.com (use -H 'Host: test.example.com' in curl)
#   - Path: / (all paths)
#
# To change the split ratio, adjust the "weight" fields below.
# For example, weight: 90 / weight: 10 sends 90% to v1 and 10% to v2.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-route
  namespace: istio-test
spec:
  parentRefs:
    - name: istio-gateway
      namespace: istio-test
  hostnames:
    - "test.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: backend-v1
          port: 80
          weight: 50
        - name: backend-v2
          port: 80
          weight: 50
