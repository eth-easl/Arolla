# Client configuration for testing the demo.
#
# The client runs from CLIENT_HOST (defined in k8s-config.sh), not the local
# machine. Traffic flows:
#   CLIENT_HOST (curl) → Gateway NodePort → HTTPRoute → backend-v1 / backend-v2
#
# The Gateway + HTTPRoute handle routing and traffic splitting server-side.
#
# ── Get the Gateway endpoint ─────────────────────────────────────────────────
#
#   NODE_PORT=$(kubectl -n istio-test get svc \
#       -l gateway.networking.k8s.io/gateway-name=istio-gateway \
#       -o jsonpath='{.spec.ports[?(@.name=="http")].nodePort}')
#
#   Or just run:  ./deploy-app.sh demo --status
#
# ── Test commands (run on CLIENT_HOST via SSH) ───────────────────────────────
#
#   ssh $CLIENT_HOST "curl -s -H 'Host: test.example.com' http://<MASTER_HOST>:\$NODE_PORT/"
#
#   # 10 requests to observe canary split:
#   ssh $CLIENT_HOST "for i in \$(seq 1 10); do
#     curl -s -H 'Host: test.example.com' http://<MASTER_HOST>:\$NODE_PORT/
#   done"
#
#   Or just run:  ./deploy-app.sh demo --test
#
# ── What the client needs to know ────────────────────────────────────────────
#
# Only the gateway hostname (must match httproute.yaml spec.hostnames).
# Everything else (routing, traffic split, backends) is server-side.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: client-config
  namespace: istio-test
data:
  # The Host header the client must send.
  # Must match spec.hostnames in httproute.yaml.
  gateway-host: "test.example.com"
