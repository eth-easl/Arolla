# DestinationRules: Istio-native traffic policies applied AFTER routing.
#
# Gateway API doesn't yet cover circuit breaking or connection pooling,
# so we use Istio's DestinationRule to add these policies per-service.
#
# What these configure:
#   - loadBalancer: ROUND_ROBIN across pods
#   - connectionPool: limits on TCP connections and HTTP requests
#   - outlierDetection: ejects unhealthy pods (circuit breaking)
#       → 5 consecutive 5xx errors = pod ejected for 30s
#       → max 50% of pods can be ejected at once
#
# Ref: https://devopscube.com/istio-ingress-kubernetes-gateway-api/
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: backend-v1-destination-rule
  namespace: istio-test
spec:
  host: backend-v1.istio-test.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 2
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: backend-v2-destination-rule
  namespace: istio-test
spec:
  host: backend-v2.istio-test.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 2
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
