apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: service-b-retry
spec:
  hosts:
  - service-b
  http:
  - route:
    - destination:
        host: service-b
    retries:
      attempts: 3
      perTryTimeout: 2s
      retryOn: 5xx
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: retry-interceptor
  namespace: default
spec:
  workloadSelector:
    labels:
      app: service-a
  configPatches:
  - applyTo: CLUSTER
    match:
      context: SIDECAR_OUTBOUND
      cluster:
        service: service-b.default.svc.cluster.local
    patch:
      operation: MERGE
      value:
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            # keep using downstream protocol like Istio already configured
            use_downstream_protocol_config:
              http_protocol_options: {}
              http2_protocol_options: {}
            # THIS is the upstream HTTP filter chain
            http_filters:
            - name: envoy.filters.http.lua
              typed_config:
                "@type": "type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua"
                inlineCode: |
                  function envoy_on_request(request_handle)
                    local attempt = request_handle:headers():get("x-envoy-attempt-count") or "1"
                    request_handle:logWarn("Lua upstream filter: envoy_on_request, attempt=" .. attempt)
                  end

                  function envoy_on_response(response_handle)
                    local attempt = response_handle:headers():get("x-envoy-attempt-count") or "1"
                    local status = response_handle:headers():get(":status") or "unknown"
                    response_handle:logWarn(
                      "Lua upstream filter: envoy_on_response, status=" .. status ..
                      ", attempt=" .. attempt
                    )
                  end
            - name: envoy.filters.http.upstream_codec
              typed_config:
                "@type": "type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec"
