version: '3.8'

services:
  # 1. Custom DNS Server
  # Simulates Route53. Can be toggled to fail resolution for DynamoDB.
  dns-server:
    build: ./dns_server
    ports:
      - "53:53/udp"
      - "8080:8080" # Management API to break/fix DNS
    volumes:
      - ./metrics:/metrics
    networks:
      vpc:
        ipv4_address: 172.20.0.2

  # 2. DynamoDB Local
  # The backend service.
  dynamodb:
    image: amazon/dynamodb-local
    command: "-jar DynamoDBLocal.jar -sharedDb"
    networks:
      vpc:
        ipv4_address: 172.20.0.3

  # 3. Control Plane Service
  # Simulates EC2 Control Plane. Depends on DynamoDB.
  control-plane:
    build: ./control_plane
    dns:
      - 172.20.0.2 # Point to our custom DNS
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - DYNAMODB_ENDPOINT=http://dynamodb.us-east-1.amazonaws.com:8000
      - MAX_WORKERS=${MAX_WORKERS:-10}
    volumes:
      - ./metrics:/metrics
    depends_on:
      - dns-server
      - dynamodb
    networks:
      vpc:
        ipv4_address: 172.20.0.4

  # 4. Network Load Balancer (NLB)
  # Nginx acting as the entry point.
  nlb:
    image: nginx:alpine
    volumes:
      - ./nlb/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - control-plane
    networks:
      vpc:
        ipv4_address: 172.20.0.5

  # 5. Client / Traffic Generator
  # Simulates external customers.
  client:
    build: ./client
    environment:
      - TARGET_URL=http://nlb/launch_instance
      - NUM_GOOD_CLIENTS=${NUM_GOOD_CLIENTS:-20}
      - NUM_BAD_CLIENTS=${NUM_BAD_CLIENTS:-0}
      - NUM_SDK_A_CLIENTS=${NUM_SDK_A_CLIENTS:-0}
      - NUM_SDK_B_CLIENTS=${NUM_SDK_B_CLIENTS:-0}
      - NUM_SDK_C_CLIENTS=${NUM_SDK_C_CLIENTS:-0}
      - NUM_SDK_D_CLIENTS=${NUM_SDK_D_CLIENTS:-0}
    volumes:
      - ./metrics:/metrics
    depends_on:
      - nlb
    networks:
      - vpc

networks:
  vpc:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
