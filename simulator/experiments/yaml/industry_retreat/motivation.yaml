# Client-Side Retry forcing Storm Behavior
# Matches legacy_test.yaml configuration exactly (Service Timeout ENABLED)

name: client_storm_test
seed: 43232

services:
  - name: svc-retry
    latency:
      median_ms: 60
      lognorm_sigma: 0.5
    workers: 16
    queue_capacity: 1000
    # CRITICAL: Service-side timeout REMOVED to verify Client Active Timeout
    # timeout:
    #   attempt_ms: 192
      
    partial_failures:
      - type: partial_failure
        start_s: 30
        end_s: 40
        p_fail: 0.5

clients:
  - name: retry
    target_service: svc-retry
    retry:
      type: fixed
      max_attempts: 4
      delay_ms: 0
    timeout:
      attempt_ms: 192
    workload:
      base_rps: 188
      duration_s: 60
      rng_seed: 1

# Output configuration
output_csv: output.csv
fault_events_json: fault_events.json
granularity_s: 1.0
# plotting_script: plotting/plot_success_rps.py
