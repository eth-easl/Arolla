# Scenario C3: Diamond topology, SYSNAME L1+L2
#
# Topology (parallel fan-out):
#              ┌→ svc-A (L1) ─┐
#   client → gateway (L1) ──→│               │→ backend-db (L1, 50% failure)
#              └→ svc-B (L1) ─┘
#
# Level 1 (per-service): Goodput-coupled budget at each hop
# Level 2 (end-to-end): Per-request budget B=2 — total retries across ALL
# paths in the diamond cannot exceed 2, preventing the synchronized retry storm.

name: c3_diamond_sysname
seed: 42

services:
  - name: backend-db
    latency:
      median_ms: 5
      lognorm_sigma: 0.3
    workers: 32
    queue_capacity: 200
    retry:
      type: fixed
      max_attempts: 3
      delay_ms: 50
    sysname_retry_budget:
      alpha: 0.1
      beta_down: 0.3
      beta_up: 0.05
      window_ms: 1000
    partial_failures:
      - type: partial_failure
        start_s: 30
        end_s: 60
        p_fail: 0.5

  - name: svc-A
    latency:
      median_ms: 3
      lognorm_sigma: 0.3
    workers: 32
    queue_capacity: 200
    retry:
      type: fixed
      max_attempts: 3
      delay_ms: 50
    sysname_retry_budget:
      alpha: 0.1
      beta_down: 0.3
      beta_up: 0.05
      window_ms: 1000
    dependencies:
      - service: backend-db

  - name: svc-B
    latency:
      median_ms: 3
      lognorm_sigma: 0.3
    workers: 32
    queue_capacity: 200
    retry:
      type: fixed
      max_attempts: 3
      delay_ms: 50
    sysname_retry_budget:
      alpha: 0.1
      beta_down: 0.3
      beta_up: 0.05
      window_ms: 1000
    dependencies:
      - service: backend-db

  - name: gateway
    latency:
      median_ms: 2
      lognorm_sigma: 0.2
    workers: 32
    queue_capacity: 200
    retry:
      type: fixed
      max_attempts: 3
      delay_ms: 50
    sysname_retry_budget:
      alpha: 0.1
      beta_down: 0.3
      beta_up: 0.05
      window_ms: 1000
    dependencies:
      - service: svc-A
      - service: svc-B
    dependency_call_pattern: parallel

clients:
  - name: client
    workload:
      base_rps: 200
      duration_s: 120
    target_service: gateway
    e2e_retry_budget: 2

output_csv: output.csv
fault_events_json: fault_events.json
granularity_s: 1.0
plotting_script: plotting/plot_all.py
plotting_script_args:
  smoothing_window: 3
  font_size: 18
  tick_size: 16
  line_width: 3.0
  no_legend_frame: true
  legend_size: 16
  figsize: "10,6"
  legend_loc: "best"
  format: pdf
