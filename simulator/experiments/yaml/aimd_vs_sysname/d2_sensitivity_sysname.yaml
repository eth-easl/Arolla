# Parameter sensitivity sweep for SYSNAME
# 3-hop chain (same as c1 baseline), sweeping key SYSNAME parameters:
#   - alpha: [0.05, 0.1, 0.2, 0.5]       (retry budget as fraction of goodput)
#   - beta_down: [0.1, 0.3, 0.5, 0.9]    (EWMA decay speed on congestion)
# Total: 4 × 4 = 16 runs

name: d2_sensitivity_sysname
seed: 42

services:
  - name: db
    latency:
      median_ms: 5
      lognorm_sigma: 0.3
    workers: 32
    queue_capacity: 200
    retry:
      type: fixed
      max_attempts: 2
      delay_ms: 50
    sysname_retry_budget:
      alpha: &alpha [0.05, 0.1, 0.2, 0.5]
      beta_down: &bd [0.1, 0.3, 0.5, 0.9]
      beta_up: 0.05
      window_ms: 1000
    partial_failures:
      - type: partial_failure
        start_s: 30
        end_s: 60
        p_fail: 0.5

  - name: backend
    latency:
      median_ms: 10
      lognorm_sigma: 0.5
    workers: 32
    queue_capacity: 100
    retry:
      type: fixed
      max_attempts: 2
      delay_ms: 100
    sysname_retry_budget:
      alpha: *alpha
      beta_down: *bd
      beta_up: 0.05
      window_ms: 1000
    dependencies:
      - service: db

  - name: frontend
    latency:
      median_ms: 5
      lognorm_sigma: 0.3
    workers: 32
    queue_capacity: 100
    retry:
      type: fixed
      max_attempts: 2
      delay_ms: 100
    sysname_retry_budget:
      alpha: *alpha
      beta_down: *bd
      beta_up: 0.05
      window_ms: 1000
    dependencies:
      - service: backend

clients:
  - name: client
    workload:
      base_rps: 300
      duration_s: 120
    target_service: frontend
    e2e_retry_budget: 2
