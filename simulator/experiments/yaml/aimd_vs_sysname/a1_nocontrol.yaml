# Scenario A1: Mixed clients, single service, NO server-side retry control
# One aggressive client (plain retries) + one polite client (with backoff)
# Shows: aggressive client starves polite client during partial failure

name: a1_mixed_nocontrol
seed: 42

services:
  - name: server
    latency:
      median_ms: 60
      lognorm_sigma: 0.5
    workers: 16
    queue_capacity: 1000
    partial_failures:
      - type: partial_failure
        start_s: 20
        end_s: 40
        p_fail: 0.5

clients:
  - name: aggressive
    replicas: 1
    target_service: server
    retry:
      type: fixed
      max_attempts: 4
      delay_ms: 0
    timeout:
      attempt_ms: 192
    workload:
      base_rps: 94
      duration_s: 70
      rng_seed: 1

  - name: polite
    replicas: 1
    target_service: server
    retry:
      type: jittered
      max_attempts: 4
      initial_delay_ms: 100
      max_delay_ms: 2000
      jitter_mode: full
    timeout:
      attempt_ms: 192
    workload:
      base_rps: 94
      duration_s: 70
      rng_seed: 2

output_csv: output.csv
fault_events_json: fault_events.json
granularity_s: 1.0
plotting_script: plotting/plot_all.py
plotting_script_args:
  smoothing_window: 3
  font_size: 18
  tick_size: 16
  line_width: 3.0
  no_legend_frame: true
  legend_size: 16
  figsize: "10,6"
  legend_loc: "best"
  format: pdf
