# Scenario C2: Diamond topology, AIMD global retry budget at each service
#
# Topology (parallel fan-out):
#              ┌→ svc-A (AIMD) ─┐
#   client → gateway (AIMD) ──→│                │→ backend-db (AIMD, 50% failure)
#              └→ svc-B (AIMD) ─┘
#
# Each service independently runs AIMD. backend-db sees combined retry storms
# from both svc-A and svc-B but can't coordinate between them.
# No end-to-end retry budget — amplification depends on AIMD parameter tuning.

name: c2_diamond_aimd
seed: 42

services:
  - name: backend-db
    latency:
      median_ms: 5
      lognorm_sigma: 0.3
    workers: 32
    queue_capacity: 200
    retry:
      type: fixed
      max_attempts: 3
      delay_ms: 50
    aimd_global_retry_budget:
      min_rps: 5
      max_rps: 100
      initial_rps: 30
      max_burst: 10
      additive_step: 5
      decrease_factor: 0.5
      window_ms: 1000
      failure_threshold: 0.1
    partial_failures:
      - type: partial_failure
        start_s: 30
        end_s: 60
        p_fail: 0.5

  - name: svc-A
    latency:
      median_ms: 3
      lognorm_sigma: 0.3
    workers: 32
    queue_capacity: 200
    retry:
      type: fixed
      max_attempts: 3
      delay_ms: 50
    aimd_global_retry_budget:
      min_rps: 5
      max_rps: 100
      initial_rps: 30
      max_burst: 10
      additive_step: 5
      decrease_factor: 0.5
      window_ms: 1000
      failure_threshold: 0.1
    dependencies:
      - service: backend-db

  - name: svc-B
    latency:
      median_ms: 3
      lognorm_sigma: 0.3
    workers: 32
    queue_capacity: 200
    retry:
      type: fixed
      max_attempts: 3
      delay_ms: 50
    aimd_global_retry_budget:
      min_rps: 5
      max_rps: 100
      initial_rps: 30
      max_burst: 10
      additive_step: 5
      decrease_factor: 0.5
      window_ms: 1000
      failure_threshold: 0.1
    dependencies:
      - service: backend-db

  - name: gateway
    latency:
      median_ms: 2
      lognorm_sigma: 0.2
    workers: 32
    queue_capacity: 200
    retry:
      type: fixed
      max_attempts: 3
      delay_ms: 50
    aimd_global_retry_budget:
      min_rps: 5
      max_rps: 100
      initial_rps: 30
      max_burst: 10
      additive_step: 5
      decrease_factor: 0.5
      window_ms: 1000
      failure_threshold: 0.1
    dependencies:
      - service: svc-A
      - service: svc-B
    dependency_call_pattern: parallel

clients:
  - name: client
    workload:
      base_rps: 200
      duration_s: 120
    target_service: gateway

output_csv: output.csv
fault_events_json: fault_events.json
granularity_s: 1.0
plotting_script: plotting/plot_all.py
plotting_script_args:
  smoothing_window: 3
  font_size: 18
  tick_size: 16
  line_width: 3.0
  no_legend_frame: true
  legend_size: 16
  figsize: "10,6"
  legend_loc: "best"
  format: pdf
