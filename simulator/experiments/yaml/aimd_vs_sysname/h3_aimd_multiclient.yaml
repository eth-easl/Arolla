# AIMD full combinatorial sweep — multi-client fairness scenario
# 4^5 = 1024 runs. Aggressive + polite clients sharing one server.
# Metrics: per-client success rate, fairness gap.

name: h3_aimd_multiclient
seed: 42

services:
  - name: server
    latency: {median_ms: 60, lognorm_sigma: 0.5}
    workers: 16
    queue_capacity: 1000
    aimd_global_retry_budget:
      min_rps: 5
      max_rps: [10, 50, 200, 500]
      initial_rps: 5
      max_burst: 10
      additive_step: [1, 10, 25, 50]
      decrease_factor: [0.1, 0.5, 0.75, 0.9]
      window_ms: [250, 1000, 2000, 5000]
      failure_threshold: [0.05, 0.1, 0.3, 0.8]
    partial_failures:
      - {type: partial_failure, start_s: 20, end_s: 40, p_fail: 0.5}

clients:
  - name: aggressive
    replicas: 1
    target_service: server
    retry: {type: fixed, max_attempts: 4, delay_ms: 0}
    timeout: {attempt_ms: 192}
    workload: {base_rps: 94, duration_s: 70, rng_seed: 1}

  - name: polite
    replicas: 1
    target_service: server
    retry: {type: jittered, max_attempts: 4, initial_delay_ms: 100, max_delay_ms: 2000, jitter_mode: full}
    timeout: {attempt_ms: 192}
    workload: {base_rps: 94, duration_s: 70, rng_seed: 2}
