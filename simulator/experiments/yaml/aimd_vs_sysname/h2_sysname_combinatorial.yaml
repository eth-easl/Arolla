# SYSNAME full combinatorial sweep: 4^4 = 256 runs
# alpha × beta_down × beta_up × window_ms
# Single service, brownout 50% from 30-60s.
# (e2e_retry_budget is a chain-level param, not relevant for single service)

name: h2_sysname_combinatorial
seed: 42

services:
  - name: server
    latency: {median_ms: 5, lognorm_sigma: 0.3}
    workers: 32
    queue_capacity: 200
    retry: {type: fixed, max_attempts: 2, delay_ms: 50}
    sysname_retry_budget:
      alpha: [0.05, 0.1, 0.3, 0.8]
      beta_down: [0.05, 0.1, 0.5, 0.9]
      beta_up: [0.01, 0.1, 0.3, 0.9]
      window_ms: [250, 1000, 2000, 5000]
    partial_failures:
      - {type: partial_failure, start_s: 30, end_s: 60, p_fail: 0.5}

clients:
  - name: client
    workload: {base_rps: 300, duration_s: 120}
    target_service: server
