# AIMD full combinatorial sweep: 4^5 = 1024 runs
# failure_threshold × decrease_factor × additive_step × max_rps × window_ms
# Single service, brownout 50% from 30-60s.

name: h1_aimd_combinatorial
seed: 42

services:
  - name: server
    latency: {median_ms: 5, lognorm_sigma: 0.3}
    workers: 32
    queue_capacity: 200
    retry: {type: fixed, max_attempts: 2, delay_ms: 50}
    aimd_global_retry_budget:
      min_rps: 5
      max_rps: [10, 50, 200, 500]
      initial_rps: 5
      max_burst: 10
      additive_step: [1, 10, 25, 50]
      decrease_factor: [0.1, 0.5, 0.75, 0.9]
      window_ms: [250, 1000, 2000, 5000]
      failure_threshold: [0.05, 0.1, 0.3, 0.8]
    partial_failures:
      - {type: partial_failure, start_s: 30, end_s: 60, p_fail: 0.5}

clients:
  - name: client
    workload: {base_rps: 300, duration_s: 120}
    target_service: server
