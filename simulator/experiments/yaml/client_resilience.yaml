name: client_resilience
seed: 42

services:
  - name: backend
    latency:
      median_ms: 20
      lognorm_sigma: 0 # Deterministic latency
    workers: 1
    queue_capacity: 100
    
    # 50% Failure Rate to trigger CB/Budget
    partial_failures:
      - type: partial_failure
        start_s: 0.0
        end_s: 30.0
        p_fail: 0.5 

clients:
  # Client 1: Standard Fixed Retry (Control)
  - name: control_fixed
    retry: 
      type: fixed
      max_attempts: 10
      delay_ms: 100
    workload: {base_rps: 10, duration_s: 10, rng_seed: 1}

  # Client 2: Circuit Breaker (Threshold 0.4)
  # With 50% failure, this should trip.
  - name: circuit_breaker
    retry: 
      type: fixed
      max_attempts: 10
      delay_ms: 100
      cb_failure_threshold: 0.4
      cb_window_size: 20
    workload: {base_rps: 10, duration_s: 10, rng_seed: 2}

  # Client 3: Retry Budget (Ratio 0.1)
  # With 50% failure (1 retry per 1 success -> 50% retry rate), 
  # budget (10%) should be exhausted quickly.
  - name: retry_budget
    retry: 
      type: fixed
      max_attempts: 10
      delay_ms: 100
      budget_ratio: 0.1
    workload: {base_rps: 10, duration_s: 10, rng_seed: 3}

output_csv: output.csv
granularity_s: 1.0
