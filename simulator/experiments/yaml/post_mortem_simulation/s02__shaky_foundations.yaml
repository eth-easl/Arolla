# Post-mortem-informed analysis - Scenario 1
# The Buggy release
#
# Scenario description:
# There is no failure, but at some point, a load spike happens (e.g. because
# of a click day, or new feature release), and the provisioned hardware resources
# cannot handle this correctly.
#
# Some real-life examples:
# - Amazon, 2021-12-07, https://aws.amazon.com/message/12721/
# - Allegro, 2018-07-18, https://allegro.tech/2018/08/postmortem-why-allegro-went-down.html
# - Spotify, 2013-04-27, https://labs.spotify.com/2013/06/04/incident-management-at-spotify/
#
# How it is reproduced in the simulator:
# - There is one service for each retry policy.
# - In normal conditions, the utilization rate ρ is ~0.8 (can handle fluctuations in the load).
# - At t=20s, we add a load spike that multiplies the requests by 1.2x.
# - At this point, the utilization rate goes above 1, and the queue starts filling up.
#   Some requests timeout.
# - At t=40s, the load spike ends.
#
# Parameters to experiment with:
# - clients[0].workload.load_spikes.rps_multiplier:
#   Multiplier for the Requests Per Seconds during the load spike
# - clients[0].timeout:
#   Amount of milliseconds after which a request fails (or retries) if it still hasn't been elapsed.
# - services[0].queue_capacity:
#   Amount of messages that can be stored in the queue for each service before new requests are discarded
#   due to the queue being full.
# - Retry policies parameters

name: s02__shaky_foundations
seed: 43232

services:
  - name: svc-no-retry
    latency: &default_latency
      median_ms: 15
      lognorm_sigma: 0.5
    workers: &default_workers 3
    queue_capacity: &default_queue 1000

  - name: svc-retry
    latency: *default_latency
    workers: *default_workers
    queue_capacity: *default_queue

  - name: svc-jitter
    latency: *default_latency
    workers: *default_workers
    queue_capacity: *default_queue

  - name: svc-cb-target
    latency: *default_latency
    workers: *default_workers
    queue_capacity: *default_queue

  - name: svc-budget-target
    latency: *default_latency
    workers: *default_workers
    queue_capacity: *default_queue

clients:
  - name: no_retries
    target_service: svc-no-retry
    retry:
      type: fixed
      max_attempts: 1
      delay_ms: 0
    timeout: &default_timeout
      attempt_ms: 1000
    workload: &default_workload
      base_rps: 160
      duration_s: 70
      rng_seed: 1
      load_spikes:
        - start_s: 20
          end_s: 40
          rps_multiplier: 1.2

  - name: three_retries
    target_service: svc-retry
    retry:
      type: fixed
      max_attempts: 4
      delay_ms: 0
    timeout: *default_timeout
    workload: *default_workload

  - name: jittered
    target_service: svc-jitter
    retry:
      type: jittered
      max_attempts: 4
      initial_delay_ms: 100
      max_delay_ms: 2000
      jitter_mode: full
    timeout: *default_timeout
    workload: *default_workload

  - name: circuit_breaker
    target_service: svc-cb-target
    retry:
      type: fixed
      max_attempts: 4
      delay_ms: 0
    circuit_breaker:
      type: time_based
      failure_threshold: 0.1
      window_duration_ms: 1000
      min_requests: 20
      half_open_delay_ms: 500
    timeout: *default_timeout
    workload: *default_workload

  - name: retry_budget
    target_service: svc-budget-target
    retry:
      type: fixed
      max_attempts: 4
      delay_ms: 0
    retry_budget:
      budget_ratio: 0.1
      max_retries: 30
    timeout: *default_timeout
    workload: *default_workload

# Output configuration
output_csv: output.csv
fault_events_json: fault_events.json
granularity_s: 1.0
plotting_script: plotting/plot_all.py
plotting_script_args:
  smoothing_window: 3
  font_size: 24
  tick_size: 22
  line_width: 3.0
  no_legend_frame: true
  legend_size: 18
  figsize: "12,6"
  legend_loc: "center left"
  legend_bbox: "1.02, 0.5"
  legend_order: "no_retries,three_retries,jittered,circuit_breaker,retry_budget"
