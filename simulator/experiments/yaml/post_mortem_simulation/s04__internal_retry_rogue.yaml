# Post-mortem analysis - Scenario 4
# "Tu quoque, Internal Recovery Systems"
#
# Scenario description:
# A small, survivable latency spike at the database layer
# gets amplified into a full system outage by the internal recoevery / retry machinery.
#
# Some real-life scenarios:
# - Amazon, 2025-10-20, https://aws.amazon.com/message/101925/
# - Amazon, 2012-10-22, https://aws.amazon.com/message/680342/
# - Google, 2019-06-02, https://status.cloud.google.com/incident/cloud-networking/19009
#
# How to reproduce inside the simulator:
# - Three independent service stacks are set up, each with three layers: db → app → gw (gateway).
#   Each stack experiences the same faults but differs in where retries are configured.
# - Stack 1 ("no retries"): no retry policy at any layer. Serves as baseline.
# - Stack 2 ("one layer"): retries only at the gateway. One layer of amplification.
# - Stack 3 ("full retries"): retries at both the gateway AND the app layer.
# - At t=20s, a severe partial failure (p_fail: 70%) hits the DB layer for 15 seconds (until t=35s).
# - At t=30s, a partial failure (p_fail: 50%) also hits the app layer for 20 seconds (until t=50s),
#   simulating cascading degradation where mid-tier services start failing under pressure.
# - Clients send 100 rps with no client-side retries, so all retry amplification
#   comes exclusively from internal service-to-service retry policies.
# - Timeouts are set at each layer, to bound individual request durations.
#
# The expected outcome is that Stack 1 degrades proportionally to the fault but recovers soon,
# Stack 2 shows moderate amplification with slower recovery, and Stack 3 demonstrates how
# multi-layer retries multiply traffic exponentially, turning a survivable DB issue into a
# full system outage that persists beyond the fault window.

name: s04__internal_retry_rogue
seed: 4242

services:
  # --- Stack 1: No retries anywhere ---
  - name: db-no-retry
    latency: &db_latency
      median_ms: 50
      lognorm_sigma: 0.5
    workers: &db_workers 10
    queue_capacity: &db_queue 150
    partial_failures: &db_fault
      - type: partial_failure
        start_s: 20
        end_s: 35
        p_fail: 0.7

  - name: app-no-retry
    latency: &app_latency
      median_ms: 10
      lognorm_sigma: 0.2
    workers: &app_workers 8
    queue_capacity: &app_queue 150
    partial_failures: &app_fault
      - type: partial_failure
        start_s: 30
        end_s: 50
        p_fail: 0.5
    timeout: &app_timeout
      global_ms: 1500
      attempt_ms: 550
    dependencies:
      - service: db-no-retry
    # No retry policy

  - name: gw-no-retry
    latency: &gw_latency
      median_ms: 2
      lognorm_sigma: 0.1
    workers: &gw_workers 8
    timeout: &gw_timeout
      global_ms: 2500
      attempt_ms: 850
    queue_capacity: &gw_queue 150
    dependencies:
      - service: app-no-retry
    # No retry policy

  # --- Stack 2: Retries only at gateway (one layer of amplification) ---
  - name: db-one-layer
    latency: *db_latency
    workers: *db_workers
    queue_capacity: *db_queue
    partial_failures: *db_fault

  - name: app-one-layer
    latency: *app_latency
    workers: *app_workers
    queue_capacity: *app_queue
    partial_failures: *app_fault
    timeout: *app_timeout
    dependencies:
      - service: db-one-layer
    # No retry

  - name: gw-one-layer
    latency: *gw_latency
    workers: *gw_workers
    queue_capacity: *gw_queue
    timeout: *gw_timeout
    dependencies:
      - service: app-one-layer
    retry:
      type: fixed
      max_attempts: 7
      delay_ms: 0

  # --- Stack 3: Retries at BOTH gateway and app (full amplification) ---
  - name: db-full-retry
    latency: *db_latency
    workers: *db_workers
    queue_capacity: *db_queue
    partial_failures: *db_fault

  - name: app-full-retry
    latency: *app_latency
    workers: *app_workers
    queue_capacity: *app_queue
    partial_failures: *app_fault
    timeout: *app_timeout
    dependencies:
      - service: db-full-retry
    retry:
      type: fixed
      max_attempts: 7
      delay_ms: 0

  - name: gw-full-retry
    latency: *gw_latency
    workers: *gw_workers
    queue_capacity: *gw_queue
    timeout: *gw_timeout
    dependencies:
      - service: app-full-retry
    retry:
      type: fixed
      max_attempts: 7
      delay_ms: 0

clients:
  - name: no_retries
    target_service: gw-no-retry
    retry:
      type: none
      max_attempts: 1
    timeout: &client_timeout
      global_ms: 3000
      attempt_ms: 1000
    workload: &client_workload
      base_rps: 100
      duration_s: 70
      rng_seed: 1

  - name: one_layer_retries
    target_service: gw-one-layer
    retry:
      type: none
      max_attempts: 1
    timeout: *client_timeout
    workload: *client_workload

  - name: full_retries
    target_service: gw-full-retry
    retry:
      type: none
      max_attempts: 1
    timeout: *client_timeout
    workload: *client_workload

# Output configuration
output_csv: output.csv
fault_events_json: fault_events.json
granularity_s: 1.0
plotting_script: plotting/plot_all.py
plotting_script_args:
  smoothing_window: 3
  font_size: 24
  tick_size: 22
  line_width: 3.0
  no_legend_frame: true
  legend_size: 18
  figsize: "12,6"
  legend_loc: "center left"
  legend_bbox: "1.02, 0.5"
  legend_order: "no_retries,one_layer_retries,full_retries"
