# Post-mortem-informed analysis - Scenario 1
# The Buggy release
#
# Scenario description:
# The release of a faulty software brings down part of the architecture (e.g. for a memory leak)
# or puts the system in a more vulnerable state (e.g. flushes the cache)
#
# Some real-life examples:
# - Google, 2025-06-12, https://status.cloud.google.com/incidents/ow5i3PPK96RduMcb1SsW
# - Slack, 2022-02-22, https://slack.engineering/slacks-incident-on-2-22-22/
# - Meta, 2010-09-10, https://engineering.fb.com/2010/09/23/uncategorized/more-details-on-today-s-outage/
#
# How it is reproduced in the simulator:
# - There is one service for each retry policy.
# - Each service is served by 3 workers.
# - In normal conditions, the utilization rate ρ is ~0.8 (can handle fluctuations in the load).
# - At t=3m, we simulate the release of a software with a bug, that makes one of the 3 workers unavailable.
#   This is achieved by injecting a partial failure with `p_fail: 33%`.
# - At this point, the utilization rate goes above 1, and the queue starts filling up. 2 workers are not enough.
#   Some requests fail. Some clients start retrying the failed requests.
# - At t=6m, we simulate that the incident reponse team correctly identified the issue and rolled back the release.
#   This is achieved by stopping the partial failure. Now all requests received by the workers are elapsed correctly.
#
# The expected outcome is that aggressive or situation-agnostic retry policies (naive retrying, jittered retries, ...)
# will prevent the service from correctly recovering from the failure, even after the rollback of the release that caused
# a third of the requests to fail.

name: s01__buggy_release
seed: 43232

services:
  - name: svc-no-retry
    latency: &default_latency
      median_ms: 60
      lognorm_sigma: 0.5
    workers: &default_workers 3
    queue_capacity: &default_queue 1000
    partial_failures: &default_partial_failures
      - type: partial_failure
        start_s: 180
        end_s: 360
        p_fail: 0.33

  - name: svc-retry
    latency: *default_latency
    workers: *default_workers
    queue_capacity: *default_queue
    partial_failures: *default_partial_failures

  - name: svc-jittered
    latency: *default_latency
    workers: *default_workers
    queue_capacity: *default_queue
    partial_failures: *default_partial_failures

  - name: svc-cb-target
    latency: *default_latency
    workers: *default_workers
    queue_capacity: *default_queue
    partial_failures: *default_partial_failures

  - name: svc-budget-target
    latency: *default_latency
    workers: *default_workers
    queue_capacity: *default_queue
    partial_failures: *default_partial_failures

clients:
  - name: no_retries
    target_service: svc-no-retry
    retry:
      type: fixed
      max_attempts: 1
      delay_ms: 0
    timeout: &default_timeout
      attempt_ms: 1000
    workload: &default_workload
      base_rps: 40
      duration_s: 600
      rng_seed: 1

  - name: three_retries
    target_service: svc-retry
    retry:
      type: fixed
      max_attempts: 4
      delay_ms: 0
    timeout: *default_timeout
    workload: *default_workload

  - name: jittered
    target_service: svc-jittered
    retry:
      type: jittered
      max_attempts: 4
      initial_delay_ms: 500
      max_delay_ms: 2000
      jitter_mode: full
    timeout: *default_timeout
    workload: *default_workload

  - name: circuit_breaker
    target_service: svc-cb-target
    retry:
      type: fixed
      max_attempts: 4
      delay_ms: 0
    circuit_breaker:
      type: time_based
      failure_threshold: 0.1
      window_duration_ms: 1000
      min_requests: 20
      half_open_delay_ms: 500
    timeout: *default_timeout
    workload: *default_workload

  - name: retry_budget
    target_service: svc-budget-target
    retry:
      type: fixed
      max_attempts: 4
      delay_ms: 0
    retry_budget:
      budget_ratio: 0.1
      max_retries: 30
    workload: *default_workload

# Output configuration
output_csv: output.csv
fault_events_json: fault_events.json
granularity_s: 1.0
plotting_script: plotting/plot_all.py
plotting_script_args:
  smoothing_window: 3
  font_size: 24
  tick_size: 22
  line_width: 3.0
  no_legend_frame: true
  legend_size: 18
  figsize: "12,6"
  legend_loc: "center left"
  legend_bbox: "1.02, 0.5"
  legend_order: "no_retries,three_retries,jittered,circuit_breaker,retry_budget"
