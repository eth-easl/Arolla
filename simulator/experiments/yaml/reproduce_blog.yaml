name: demo_exponential
seed: 42

services:
  - name: svc-fixed-target
    latency: {median_ms: 10, lognorm_sigma: 0}
    # Increased workers to handle 1000 RPS (approx 40-50 needed for 10ms processing)
    workers: 1000
    queue_capacity: 10000
    partial_failures:
      - type: partial_failure
        start_s: 0.5
        end_s: 1.5
        p_fail: 1.0

  - name: svc-exp-target
    latency: {median_ms: 10, lognorm_sigma: 0}
    workers: 1000
    queue_capacity: 10000
    partial_failures:
      - type: partial_failure
        start_s: 0.5
        end_s: 1.5
        p_fail: 1.0

  - name: svc-jitter-target
    latency: {median_ms: 10, lognorm_sigma: 0}
    workers: 1000
    queue_capacity: 10000
    partial_failures:
      - type: partial_failure
        start_s: 0.5
        end_s: 1.5
        p_fail: 1.0

clients:
  - name: client-fixed
    target_service: svc-fixed-target
    retry: 
      type: fixed
      max_attempts: 4
      delay_ms: 0
    workload: 
      base_rps: 10000
      duration_s: 2
      rng_seed: 1

  - name: client-exp
    target_service: svc-exp-target
    retry: 
      type: exponential
      max_attempts: 4
      initial_delay_ms: 50
      max_delay_ms: 1000
    workload: 
      base_rps: 10000
      duration_s: 2
      rng_seed: 1

  - name: client-jitter
    target_service: svc-jitter-target
    retry: 
      type: jittered
      max_attempts: 4
      initial_delay_ms: 50
      max_delay_ms: 1000
      jitter_mode: full
    workload: 
      base_rps: 10000
      duration_s: 2
      rng_seed: 1

output_csv: output.csv
fault_events_json: faults.json
granularity_s: 0.05 # Match reference 20ms buckets (50Hz)
plotting_script: plotting/reproduce_figures.py
