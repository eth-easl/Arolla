name: benchmark_istio_partial_failure
seed: 42

services:
  - name: svc-A
    latency:
      median_ms: 60
      lognorm_sigma: 0.55
    workers: 16
    queue_capacity: 250
    timeout:
      attempt_ms: 160
    istio_retry_budget:
      percent: 20.0
      min_retry_concurrency: 3
    partial_failures:
      - type: partial_failure
        start_s: 22
        end_s: 48
        p_fail: 0.65

clients:
  - name: client-gold
    target_service: svc-A
    retry:
      type: fixed
      max_attempts: 4
      delay_ms: 0
    timeout:
      attempt_ms: 160
    workload:
      base_rps: 100
      duration_s: 90

  - name: client-silver
    target_service: svc-A
    retry:
      type: fixed
      max_attempts: 4
      delay_ms: 0
    timeout:
      attempt_ms: 160
    workload:
      base_rps: 70
      duration_s: 90

  - name: client-bronze
    target_service: svc-A
    retry:
      type: fixed
      max_attempts: 4
      delay_ms: 0
    timeout:
      attempt_ms: 160
    workload:
      base_rps: 45
      duration_s: 90

output_csv: output.csv
fault_events_json: fault_events.json
granularity_s: 1.0
