name: benchmark_istio_adaptive_recovery_diagnostic
seed: 42

# Diagnostic scenario: the static YAML budget is intentionally too restrictive
# so the adaptive controller has room to reopen retries when they are useful.
services:
  - name: svc-A
    latency:
      median_ms: 60
      lognorm_sigma: 0.5
    workers: 16
    queue_capacity: 220
    timeout:
      attempt_ms: 170
    istio_retry_budget:
      percent: 0.0
      min_retry_concurrency: 0
    partial_failures:
      - type: partial_failure
        start_s: 22
        end_s: 46
        p_fail: 0.55

clients:
  - name: client-gold
    target_service: svc-A
    retry:
      type: fixed
      max_attempts: 4
      delay_ms: 0
    timeout:
      attempt_ms: 170
    workload:
      base_rps: 88
      duration_s: 90

  - name: client-silver
    target_service: svc-A
    retry:
      type: fixed
      max_attempts: 4
      delay_ms: 0
    timeout:
      attempt_ms: 170
    workload:
      base_rps: 58
      duration_s: 90

  - name: client-bronze
    target_service: svc-A
    retry:
      type: fixed
      max_attempts: 4
      delay_ms: 0
    timeout:
      attempt_ms: 170
    workload:
      base_rps: 36
      duration_s: 90

output_csv: output.csv
fault_events_json: fault_events.json
granularity_s: 1.0
