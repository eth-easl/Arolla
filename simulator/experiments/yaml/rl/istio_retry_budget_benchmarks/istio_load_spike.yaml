name: benchmark_istio_load_spike
seed: 42

services:
  - name: svc-A
    latency:
      median_ms: 58
      lognorm_sigma: 0.5
    workers: 16
    queue_capacity: 180
    timeout:
      attempt_ms: 144
    istio_retry_budget:
      percent: 20.0
      min_retry_concurrency: 3

clients:
  - name: client-gold
    target_service: svc-A
    retry:
      type: fixed
      max_attempts: 4
      delay_ms: 0
    timeout:
      attempt_ms: 144
    workload:
      base_rps: 95
      duration_s: 90
      load_spikes:
        - type: load_spike
          start_s: 24
          end_s: 54
          rps_multiplier: 3.4

  - name: client-silver
    target_service: svc-A
    retry:
      type: fixed
      max_attempts: 4
      delay_ms: 0
    timeout:
      attempt_ms: 144
    workload:
      base_rps: 65
      duration_s: 90
      load_spikes:
        - type: load_spike
          start_s: 24
          end_s: 54
          rps_multiplier: 2.9

  - name: client-bronze
    target_service: svc-A
    retry:
      type: fixed
      max_attempts: 4
      delay_ms: 0
    timeout:
      attempt_ms: 144
    workload:
      base_rps: 42
      duration_s: 90
      load_spikes:
        - type: load_spike
          start_s: 24
          end_s: 54
          rps_multiplier: 2.4

output_csv: output.csv
fault_events_json: fault_events.json
granularity_s: 1.0
