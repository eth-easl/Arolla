name: benchmark_recovery_with_spike_fairness
seed: 42

services:
  - name: svc-A
    latency:
      median_ms: 60
      lognorm_sigma: 0.5
    workers: 16
    queue_capacity: 1500
    timeout:
      attempt_ms: 192
    global_retry_budget:
      target_rps: 35
      max_burst: 25
    partial_failures:
      - type: partial_failure
        start_s: 22
        end_s: 34
        p_fail: 0.35

clients:
  - name: client-gold
    target_service: svc-A
    retry:
      type: fixed
      max_attempts: 4
      delay_ms: 0
    timeout:
      attempt_ms: 192
    workload:
      base_rps: 90
      duration_s: 80
      load_spikes:
        - type: load_spike
          start_s: 34
          end_s: 44
          rps_multiplier: 2.0

  - name: client-silver
    target_service: svc-A
    retry:
      type: fixed
      max_attempts: 4
      delay_ms: 0
    timeout:
      attempt_ms: 192
    workload:
      base_rps: 60
      duration_s: 80
      load_spikes:
        - type: load_spike
          start_s: 34
          end_s: 44
          rps_multiplier: 1.8

  - name: client-bronze
    target_service: svc-A
    retry:
      type: fixed
      max_attempts: 4
      delay_ms: 0
    timeout:
      attempt_ms: 192
    workload:
      base_rps: 38
      duration_s: 80
      load_spikes:
        - type: load_spike
          start_s: 34
          end_s: 44
          rps_multiplier: 1.6

output_csv: output.csv
fault_events_json: fault_events.json
granularity_s: 1.0
