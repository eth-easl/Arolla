name: benchmark_metastable_partial_failure_fairness
seed: 42

services:
  - name: svc-A
    latency:
      median_ms: 60
      lognorm_sigma: 0.5
    workers: 16
    queue_capacity: 1000
    timeout:
      attempt_ms: 192
    global_retry_budget:
      target_rps: 30
      max_burst: 50
    partial_failures:
      - type: partial_failure
        start_s: 20
        end_s: 40
        p_fail: 0.5

clients:
  - name: client-gold
    target_service: svc-A
    retry:
      type: fixed
      max_attempts: 4
      delay_ms: 0
    timeout:
      attempt_ms: 192
    workload:
      base_rps: 90
      duration_s: 80

  - name: client-silver
    target_service: svc-A
    retry:
      type: fixed
      max_attempts: 4
      delay_ms: 0
    timeout:
      attempt_ms: 192
    workload:
      base_rps: 60
      duration_s: 80

  - name: client-bronze
    target_service: svc-A
    retry:
      type: fixed
      max_attempts: 4
      delay_ms: 0
    timeout:
      attempt_ms: 192
    workload:
      base_rps: 38
      duration_s: 80

output_csv: output.csv
fault_events_json: fault_events.json
granularity_s: 1.0
