name: sync_control
seed: 42

services:
  - name: backend
    latency:
      median_ms: 10
      lognorm_sigma: 0.1
    workers: 10
    queue_capacity: 50
    
    # CONTROL: Fixed Retry (Identical for all clients)
    # retry: moved to client
    
    # Trigger: 2s Outage to force everyone into retry mode simultaneously
    partial_failures:
      - type: partial_failure
        start_s: 5.0
        end_s: 7.0
        p_fail: 1.0

clients:
  # 5 Identical Clients
  - name: client_1
    retry: {type: fixed, max_attempts: 10, delay_ms: 200}
    workload: {base_rps: 40, duration_s: 15, rng_seed: 1}
  - name: client_2
    retry: {type: fixed, max_attempts: 10, delay_ms: 200}
    workload: {base_rps: 40, duration_s: 15, rng_seed: 2}
  - name: client_3
    retry: {type: fixed, max_attempts: 10, delay_ms: 200}
    workload: {base_rps: 40, duration_s: 15, rng_seed: 3}
  - name: client_4
    retry: {type: fixed, max_attempts: 10, delay_ms: 200}
    workload: {base_rps: 40, duration_s: 15, rng_seed: 4}
  - name: client_5
    retry: {type: fixed, max_attempts: 10, delay_ms: 200}
    workload: {base_rps: 40, duration_s: 15, rng_seed: 5}

output_csv: output.csv
granularity_s: 0.1 # High resolution to see the spikes
