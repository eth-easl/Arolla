# C4: Client-Count Scaling
# Fixed per-client load, N in {1, 10, 50, 100}
# Moderate failure injection
# Measure: goodput, amplification vs. N

name: c4_client_scaling
seed: 42

services:
  - name: backend
    latency:
      median_ms: 10
      lognorm_sigma: 0.5
    workers: 64
    queue_capacity: 500

    retry:
      type: exponential
      max_attempts: 3
      initial_delay_ms: 50
      max_delay_ms: 500

    sysname_retry_budget:
      alpha: 0.1
      beta_down: 0.3
      beta_up: 0.05
      window_ms: 1000

    partial_failures:
      - type: partial_failure
        start_s: 30
        end_s: 60
        p_fail: 0.3

clients:
  - name: tenant
    workload:
      base_rps: 10
      duration_s: 120
    target_service: backend
    e2e_retry_budget: 2
    replicas: [1, 10, 50, 100]

output_csv: output.csv
fault_events_json: fault_events.json
granularity_s: 1.0
