# C1 Baseline: AIMD Global Retry Budget
# 3-hop chain (Frontend -> Backend -> DB)
# DB brownout (p_fail=0.5) from 30-60s, then recovery
# AIMD self-tuning retry budget on each service

name: c1_baseline_aimd
seed: 42

services:
  - name: db
    latency:
      median_ms: 5
      lognorm_sigma: 0.3
    workers: 32
    queue_capacity: 200

    retry:
      type: fixed
      max_attempts: 2
      delay_ms: 50

    aimd_global_retry_budget:
      min_rps: 5
      max_rps: 100
      initial_rps: 30
      max_burst: 10
      additive_step: 5
      decrease_factor: 0.5
      window_ms: 1000
      failure_threshold: 0.1

    partial_failures:
      - type: partial_failure
        start_s: 30
        end_s: 60
        p_fail: 0.5

  - name: backend
    latency:
      median_ms: 10
      lognorm_sigma: 0.5
    workers: 32
    queue_capacity: 100

    retry:
      type: fixed
      max_attempts: 2
      delay_ms: 100

    aimd_global_retry_budget:
      min_rps: 5
      max_rps: 100
      initial_rps: 30
      max_burst: 10
      additive_step: 5
      decrease_factor: 0.5
      window_ms: 1000
      failure_threshold: 0.1

    dependencies:
      - service: db

  - name: frontend
    latency:
      median_ms: 5
      lognorm_sigma: 0.3
    workers: 32
    queue_capacity: 100

    retry:
      type: fixed
      max_attempts: 2
      delay_ms: 100

    aimd_global_retry_budget:
      min_rps: 5
      max_rps: 100
      initial_rps: 30
      max_burst: 10
      additive_step: 5
      decrease_factor: 0.5
      window_ms: 1000
      failure_threshold: 0.1

    dependencies:
      - service: backend

clients:
  - name: client
    workload:
      base_rps: 300
      duration_s: 120
    target_service: frontend

output_csv: output.csv
fault_events_json: fault_events.json
granularity_s: 1.0
