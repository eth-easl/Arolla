# C1: Recovery Under Correlated Failure
# 3-hop chain (Frontend -> Backend -> DB)
# DB brownout (p_fail=0.5) from 30-60s, then recovery
# SYSNAME L1+L2 (B=2)

name: c1_sysname_recovery
seed: 42

services:
  - name: db
    latency:
      median_ms: 5
      lognorm_sigma: 0.3
    workers: 32
    queue_capacity: 200

    retry:
      type: fixed
      max_attempts: 2
      delay_ms: 50

    sysname_retry_budget:
      alpha: 0.1
      beta_down: 0.3
      beta_up: 0.05
      window_ms: 1000

    partial_failures:
      - type: partial_failure
        start_s: 30
        end_s: 60
        p_fail: 0.5

  - name: backend
    latency:
      median_ms: 10
      lognorm_sigma: 0.5
    workers: 32
    queue_capacity: 100

    retry:
      type: fixed
      max_attempts: 2
      delay_ms: 100

    sysname_retry_budget:
      alpha: 0.1
      beta_down: 0.3
      beta_up: 0.05
      window_ms: 1000

    dependencies:
      - service: db

  - name: frontend
    latency:
      median_ms: 5
      lognorm_sigma: 0.3
    workers: 32
    queue_capacity: 100

    retry:
      type: fixed
      max_attempts: 2
      delay_ms: 100

    sysname_retry_budget:
      alpha: 0.1
      beta_down: 0.3
      beta_up: 0.05
      window_ms: 1000

    dependencies:
      - service: backend

clients:
  - name: client
    workload:
      base_rps: 300
      duration_s: 120
    target_service: frontend
    e2e_retry_budget: 2

output_csv: output.csv
fault_events_json: fault_events.json
granularity_s: 1.0
