# S1: SYSNAME Parameter Sensitivity
# Sweep alpha in {0.01, 0.05, 0.1, 0.2, 0.5}
# Single service with 50% failure, measure goodput and amplification

name: s1_param_sweep
seed: 42

services:
  - name: backend
    latency:
      median_ms: 10
      lognorm_sigma: 0.5
    workers: 32
    queue_capacity: 100

    retry:
      type: exponential
      max_attempts: 3
      initial_delay_ms: 50
      max_delay_ms: 500

    sysname_retry_budget:
      alpha: [0.01, 0.05, 0.1, 0.2, 0.5]
      beta_down: 0.3
      beta_up: 0.05
      window_ms: 1000

    partial_failures:
      - type: partial_failure
        start_s: 30
        end_s: 60
        p_fail: 0.5

clients:
  - name: client
    workload:
      base_rps: 500
      duration_s: 120
    target_service: backend
    e2e_retry_budget: 2

output_csv: output.csv
fault_events_json: fault_events.json
granularity_s: 1.0

