# S2: SYSNAME Component Ablation
# Single service, 50% failure injection 30-60s, 500 RPS, 120s
# Variants controlled by sweep: Level 1 only, Level 2 only, L1+L2, L1+L2+enhancement
# Baselines: run separately with different configs (no-retry, exp-backoff, circuit-breaker, static-budget, AIMD)

name: s2_sysname_ablation
seed: 42

services:
  - name: backend
    latency:
      median_ms: 10
      lognorm_sigma: 0.5
    workers: 32
    queue_capacity: 100

    retry:
      type: exponential
      max_attempts: 3
      initial_delay_ms: 50
      max_delay_ms: 500

    sysname_retry_budget:
      alpha: 0.1
      beta_down: 0.3
      beta_up: 0.05
      window_ms: 1000

    partial_failures:
      - type: partial_failure
        start_s: 30
        end_s: 60
        p_fail: 0.5

clients:
  - name: client
    workload:
      base_rps: 500
      duration_s: 120
    target_service: backend
    e2e_retry_budget: 2

output_csv: output.csv
fault_events_json: fault_events.json
granularity_s: 1.0
