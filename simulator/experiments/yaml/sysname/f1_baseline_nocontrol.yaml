# F1 Baseline: No Retry Control
# 2 clients: well-behaved (200 RPS) + aggressive (400 RPS, tight timeout)
# Exponential backoff only, no server-side limiter

name: f1_baseline_nocontrol
seed: 42

services:
  - name: backend
    latency:
      median_ms: 10
      lognorm_sigma: 0.5
    workers: 32
    queue_capacity: 100

    retry:
      type: exponential
      max_attempts: 3
      initial_delay_ms: 50
      max_delay_ms: 500

    partial_failures:
      - type: partial_failure
        start_s: 30
        end_s: 90
        p_fail: 0.3

clients:
  - name: good-tenant
    workload:
      base_rps: 200
      duration_s: 120
    target_service: backend
    timeout:
      attempt_ms: 500

  - name: bad-tenant
    workload:
      base_rps: 400
      duration_s: 120
    target_service: backend
    timeout:
      attempt_ms: 50

output_csv: output.csv
fault_events_json: fault_events.json
granularity_s: 1.0
