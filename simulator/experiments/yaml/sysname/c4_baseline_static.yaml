# C4 Baseline: Static Token Bucket
# Fixed per-client load, N in {1, 10, 50, 100}
# Moderate failure injection
# Static global retry budget

name: c4_baseline_static
seed: 42

services:
  - name: backend
    latency:
      median_ms: 10
      lognorm_sigma: 0.5
    workers: 64
    queue_capacity: 500

    retry:
      type: exponential
      max_attempts: 3
      initial_delay_ms: 50
      max_delay_ms: 500

    global_retry_budget:
      target_rps: 10
      max_burst: 10

    partial_failures:
      - type: partial_failure
        start_s: 30
        end_s: 60
        p_fail: 0.3

clients:
  - name: tenant
    workload:
      base_rps: 10
      duration_s: 120
    target_service: backend
    replicas: [1, 10, 50, 100]

output_csv: output.csv
fault_events_json: fault_events.json
granularity_s: 1.0
