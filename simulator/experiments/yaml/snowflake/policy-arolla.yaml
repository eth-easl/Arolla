# Client-Side Retry forcing Storm Behavior
# Matches legacy_test.yaml configuration exactly (Service Timeout ENABLED)

name: diversity_test
seed: 43232

services:
  - name: svc
    latency:
      median_ms: 60
      lognorm_sigma: 0.5
    workers: 16
    queue_capacity: 1000
    partial_failures:
      - type: partial_failure
        start_s: 20
        end_s: 40
        p_fail: 0.5
    
    # aimd_global_retry_budget:
    #   min_rps: 5
    #   max_rps: 100
    #   initial_rps: 40
    #   max_burst: 10
    #   additive_step: 5       # Add 5 RPS per second if healthy
    #   decrease_factor: 0.5   # Cut by 50% if >10% failure
    #   window_ms: 1000        # Update every 1s
    #   failure_threshold: 0.1
    # retry_budget:
    #   budget_ratio: 0.1
    #   max_retries: 30
    # circuit_breaker:
    #   type: time_based
    #   failure_threshold: 0.1
    #   window_duration_ms: 1000
    #   min_requests: 20
    #   half_open_delay_ms: 500
    arolla_retry_budget:
      alpha: 0.1
      beta_down: 0.3
      beta_up: 0.15
      window_ms: 1000


clients:
  # - name: no_retries
  #   replicas: 47
  #   target_service: svc
  #   retry:
  #     type: fixed
  #     max_attempts: 1
  #     delay_ms: 0
  #   timeout:
  #     attempt_ms: 192
  #   workload: &default_workload
  #     base_rps: 188
  #     duration_s: 70
  #     rng_seed: 1

  - name: three_retries
    replicas: 1
    target_service: svc
    retry:
      type: fixed
      max_attempts: 4
      delay_ms: 0
    timeout:
      attempt_ms: 192
    workload: &default_workload
      base_rps: 40
      duration_s: 70
      rng_seed: 1

  - name: exponential_backoff_jitter
    replicas: 1
    target_service: svc
    retry: 
      type: jittered
      max_attempts: 4
      initial_delay_ms: 100
      max_delay_ms: 2000
      jitter_mode: full
    timeout:
      attempt_ms: 192
    workload: *default_workload
 
  - name: circuit_breaker
    replicas: 1
    target_service: svc
    retry: 
      type: fixed
      max_attempts: 4
      delay_ms: 0
    circuit_breaker:
      type: time_based
      failure_threshold: 0.1
      window_duration_ms: 1000
      min_requests: 20
      half_open_delay_ms: 500
    timeout:
      attempt_ms: 192
    workload: *default_workload

  - name: retry_budget
    replicas: 1
    target_service: svc
    retry: 
      type: fixed
      max_attempts: 4
      delay_ms: 0
    retry_budget:
      budget_ratio: 0.1
      max_retries: 30
    workload: *default_workload 


# Output configuration
output_csv: output.csv
fault_events_json: fault_events.json
granularity_s: 1.0
plotting_script: plotting/plot_all.py
plotting_script_args:
  smoothing_window: 5
  font_size: 18
  tick_size: 16
  line_width: 3.0
  no_legend_frame: true
  legend_size: 16
  figsize: "8,6"
  legend_loc: "best"
  # legend_bbox: "0.6, 0.5"
  legend_order: "no_retries,three_retries,exponential_backoff_jitter,circuit_breaker,retry_budget"
  legend_labels: "three_retries=Client 1,exponential_backoff_jitter=Client 2,circuit_breaker=Client 3,retry_budget=Client 4"
  format: pdf
